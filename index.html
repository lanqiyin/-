<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Under the Stage — an interactive listening room</title><style>
*{box-sizing:border-box}body{margin:0;background:#100a09;color:#eee3d0;font-family:Georgia,serif;overflow-x:hidden}button{font:inherit;cursor:pointer}header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid #ffffff20;position:relative;z-index:2}.brand{letter-spacing:.22em;font-size:12px}.brand b{color:#d7482e}.right{display:flex;gap:20px;align-items:center;font:11px Arial;letter-spacing:.16em}.sound{background:none;border:1px solid #77665c;color:#e8dac4;padding:11px 15px}.hero{text-align:center;padding:38px 20px 0}.eyebrow{font:10px Arial;letter-spacing:.32em;color:#c25a43}.hero h1{font-size:clamp(42px,7vw,92px);letter-spacing:.06em;font-weight:400;margin:10px 0 5px;line-height:1}.hero h1 em{font-weight:400;color:#c63d28}.hero p{color:#aa9b8a;font-size:14px;font-style:italic}.scene{height:550px;position:relative;max-width:1200px;margin:-18px auto 0;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#8a2519 0%,#39120f 30%,transparent 66%)}.scene:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 8%,#0002 9%,transparent 11%),linear-gradient(180deg,#100a09 0%,transparent 30%,#100a09 100%);pointer-events:none}.curtain{position:absolute;top:0;width:20%;height:74%;background:repeating-linear-gradient(90deg,#290b0b,#651a17 18%,#260808 35%);box-shadow:0 0 50px #000;opacity:.85}.curtain.left{left:-5%;clip-path:polygon(0 0,100% 0,70% 100%,0 100%)}.curtain.right{right:-5%;clip-path:polygon(0 0,100% 0,100% 100%,30% 100%)}.light{position:absolute;width:30%;height:85%;top:0;left:35%;background:linear-gradient(#e9b46b25,transparent);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}.platform{position:absolute;left:12%;right:12%;bottom:52px;height:170px;border-radius:50%;background:repeating-radial-gradient(ellipse,#63372a 0 2px,#3e211b 4px 24px);border:8px solid #28110e;box-shadow:0 22px 0 #24110e,0 34px 35px #000;transform:perspective(700px) rotateX(48deg)}.platform:after{content:'';position:absolute;inset:18%;border:2px solid #ab60463d;border-radius:50%;animation:spin 22s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.furniture{position:absolute;bottom:170px;left:46%;color:#160b09;font-size:45px;opacity:.9;text-shadow:35px 15px #27110d}.cast{position:absolute;inset:0}.actor{position:absolute;bottom:calc(105px + var(--y)*1px);left:calc(50% + var(--x)*1%);width:52px;height:140px;border:0;background:transparent;transform:translateX(-50%) scale(var(--s));color:#fff;z-index:calc(20 + var(--z));padding:0;transition:filter .2s}.actor:hover,.actor:focus-visible{filter:drop-shadow(0 0 12px #ffc483);outline:none}.head{position:absolute;top:4px;left:17px;width:19px;height:23px;background:#c49d80;border-radius:45%;border-top:8px solid var(--hair,#32201a)}.body{position:absolute;top:25px;left:11px;width:30px;height:57px;background:var(--coat,#473a32);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);border-radius:6px 6px 0 0}.arm{position:absolute;top:28px;left:5px;width:10px;height:50px;background:var(--coat,#473a32);transform:rotate(9deg);border-radius:6px}.arm.r{left:38px;transform:rotate(-9deg)}.legs{position:absolute;top:80px;left:13px;width:11px;height:53px;background:var(--pants,#222527);box-shadow:16px 0 var(--pants,#222527)}.orpheus .body{background:linear-gradient(90deg,#d5c6ad 0 20%,#273a4a 20% 80%,#d5c6ad 80%)}.orpheus .arm{background:#d5c6ad}.orpheus .head:after{content:'';position:absolute;top:18px;left:-4px;width:26px;height:7px;background:#a82921}.label{position:absolute;top:-27px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#e8d7bb;color:#28120e;padding:6px 9px;font:10px Arial;letter-spacing:.1em;opacity:0}.actor:hover .label,.actor:focus-visible .label{opacity:1}.caption{max-width:1050px;margin:-20px auto 0;display:flex;justify-content:space-between;gap:20px;padding:0 20px 35px;color:#a99480;font:10px Arial;letter-spacing:.18em;text-transform:uppercase}.caption b{color:#d4634c}.paper-view{position:fixed;inset:0;z-index:10;background:#0b0908;display:none;align-items:center;justify-content:center;padding:30px}.paper-view.open{display:flex}.paper{position:relative;width:min(480px,90vw);min-height:min(680px,80vh);background:#d8c6a1;color:#392c24;padding:65px 55px;box-shadow:0 0 70px #000;background-image:radial-gradient(#775d3b33 1px,transparent 1px),linear-gradient(115deg,#e9d8b7,#cdb78f);background-size:7px 7px,auto}.paper small{font:10px Arial;letter-spacing:.22em;color:#8b5545}.paper h2{font-size:44px;font-weight:400;margin:25px 0}.paper hr{border:0;border-top:1px solid #886f56}.paper p{line-height:1.9;color:#65513e;font-style:italic}.back{position:absolute;right:5%;bottom:5%;background:none;border:1px solid #907b69;color:#eadbc6;padding:15px 22px;font:10px Arial;letter-spacing:.18em}.note{position:absolute;bottom:30px;font:10px Arial;letter-spacing:.1em;color:#8b705b}.status{color:#c98975}.actor:focus-visible .label{opacity:1}@media(max-width:700px){header{padding:0 20px}.right span{display:none}.scene{height:420px}.platform{left:0;right:0;bottom:45px}.actor{left:calc(50% + var(--x)*1.4%);bottom:calc(90px + var(--y)*.7px);transform:translateX(-50%) scale(calc(var(--s)*.75))}.curtain{width:14%}.caption{font-size:9px}.paper{padding:45px 32px}.back{bottom:15px}.note{display:none}}
 .hero h1{font-family:Arial,Helvetica,sans-serif;font-size:clamp(38px,6vw,78px);font-weight:800;letter-spacing:.04em;color:#eee3d0;margin:15px 0 25px}.paper-view.open .paper{animation:paperIn .9s ease both}@keyframes paperIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}.solo{position:absolute;left:calc(50% - 360px);top:50%;width:52px;height:140px;transform:translate(-50%,-50%) scale(1.7);filter:drop-shadow(0 0 20px #b94a2b55)}.solo .label{display:none}@media(max-width:760px){.paper-view{align-items:center;padding:20px 20px 75px}.paper{width:min(480px,75vw);min-height:60vh;margin-left:14vw}.solo{left:10%;transform:translate(-50%,-50%) scale(.9)}.hero h1{font-size:clamp(30px,7vw,52px)}}@media(prefers-reduced-motion:reduce){.paper-view.open .paper{animation:none}.platform:after{animation:none}}.paper-view{z-index:1000} body.character-open > header,body.character-open > main{visibility:hidden;pointer-events:none}</style></head><body><header><div class="brand"><b>●</b> &nbsp; UNDER THE STAGE</div><div class="right"><span>AN INTERACTIVE LISTENING ROOM</span><button class="sound" id="sound">♪ &nbsp; START SOUND</button></div></header><main><section class="hero"><h1>UNDER THE STAGE</h1></section><div class="scene"><div class="light"></div><div class="platform"></div><div class="furniture" aria-hidden="true">♜ &nbsp; ▰</div><div class="cast" id="cast"></div></div><div class="caption"><div><b>01 / THE STAGE</b> &nbsp; · &nbsp; A WORLD IN MOTION</div><div>HOVER TO LISTEN &nbsp; / &nbsp; CLICK TO ENTER</div></div></main><section class="paper-view" id="page" aria-label="Character page"><div class="solo" id="solo" aria-hidden="true"></div><article class="paper"><small>UNDER THE STAGE &nbsp; / &nbsp; CHARACTER NOTES</small><h2 id="name"></h2><hr><p id="verse"></p><p>Here, a voice waits to be heard.<br>Follow it through the dark.</p><div class="note">ORIGINAL PLACEHOLDER TEXT · LYRICS TO BE ADDED</div></article><button class="back" id="back">← &nbsp; BACK ON STAGE</button></section><script>
const people=[['Orpheus',-10,20,1.05,'orpheus','#273a4a'],['Eurydice',9,17,1.04,'','#3b302a'],['Hermes',-31,45,.86,'','#514139'],['Persephone',28,48,.86,'','#674135'],['Hades',0,66,.88,'','#24262a'],['Fate I',-38,15,.9,'','#57463c'],['Fate II',-27,8,.96,'','#6a4a3d'],['Fate III',37,12,.93,'','#4c3a34'],['Worker I',-18,64,.8,'','#46413b'],['Worker II',18,66,.8,'','#4d4137'],['Worker III',-34,48,.78,'','#3d3932'],['Worker IV',34,48,.78,'','#52463a']];let cast=document.querySelector('#cast'),selected=null,ctx,tracks=[],timer,step=0;people.forEach((p,i)=>{let b=document.createElement('button');b.className='actor '+p[4];b.setAttribute('aria-label','Listen to '+p[0]);b.style.cssText=`--x:${p[1]};--y:${p[2]};--s:${p[3]};--z:${100-p[2]};--coat:${p[5]};--pants:${i===0?'#273a4a':'#272422'}`;b.innerHTML=`<span class="label">${p[0].toUpperCase()}</span><span class="head"></span><span class="arm"></span><span class="arm r"></span><span class="body"></span><span class="legs"></span>`;b.onmouseenter=()=>focus(i);b.onmouseleave=()=>focus(selected);b.onfocus=()=>focus(i);b.onblur=()=>focus(selected);b.onclick=()=>{selected=i;focus(i);let solo=document.querySelector('#solo');solo.innerHTML=b.innerHTML;solo.className='solo '+p[4];solo.style.cssText=`--coat:${p[5]};--pants:${i===0?'#273a4a':'#272422'}`;document.querySelector('#name').textContent=p[0];document.querySelector('#verse').textContent='A story carried by '+p[0]+'.\nThe words of this part will find their place here.';document.body.classList.add('character-open');document.querySelector('#page').classList.add('open')};cast.appendChild(b)});function focus(i){if(!ctx)return;tracks.forEach((g,n)=>g.gain.setTargetAtTime(i===null?0.08:(n===i?.12:.0015),ctx.currentTime,.12))}function note(n,f,d){let o=ctx.createOscillator(),a=ctx.createGain();o.type=n<12?'sine':(n===12?'triangle':'sine');o.frequency.value=f;a.gain.setValueAtTime(.0001,ctx.currentTime);a.gain.exponentialRampToValueAtTime(.15,ctx.currentTime+.03);a.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+d);o.connect(a).connect(tracks[n]);o.start();o.stop(ctx.currentTime+d+.02)}function tick(){let scale=[110,130.81,146.83,164.81,196,220,261.63];for(let i=0;i<12;i++)if((step+i*2)%16===0)note(i,scale[(i+Math.floor(step/16))%7]*2,.65);if(step%2===0)note(12,scale[Math.floor(step/8)%7],.3);if(step%4===0){note(13,scale[(Math.floor(step/8)+2)%7]*2,.5);note(14,scale[(Math.floor(step/8)+4)%7]*2,.5)}if(step%8===0)note(15,55,.8);if(step%2===1)note(16,880,.045);step++}document.querySelector('#sound').onclick=async()=>{if(!ctx){ctx=new AudioContext();tracks=Array.from({length:17},()=>{let g=ctx.createGain();g.gain.value=.08;g.connect(ctx.destination);return g});timer=setInterval(tick,235);tick();document.querySelector('#sound').textContent='♫   SOUND ON'}else if(ctx.state==='running'){await ctx.suspend();document.querySelector('#sound').textContent='♪   SOUND OFF'}else{await ctx.resume();document.querySelector('#sound').textContent='♫   SOUND ON'}};document.querySelector('#back').onclick=()=>{selected=null;document.querySelector('#page').classList.remove('open');document.body.classList.remove('character-open');focus(null)};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selected!==null)document.querySelector('#back').click()});</script></body></html>
